<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <div class="constainer flex bg-black">

        <div class="left  bg-black">

            <div class="home bg-gray rounded m-1 p-1">
                <img style="height: 20px;" width="200" class="invert" height="40" src="spotify.svg" alt="spotify">

                <ul>
                    <li>

                        <img class="invert" src="home.svg" alt="home">
                        <span style="color: white;">home</span>
                    </li>

                    <li>
                        <img class="invert" src="search.svg" alt="search">
                        <span style="color: white;">search</span>
                    </li>
                </ul>
            </div>
            <div class="library bg-gray rounded m-1 p-1">
                <div class="heading">
                    <img style="color: white;" src="library.svg" alt="library">
                    <h2>
                        Library
                    </h2>
                </div>
                <div class="footer">
                    <div>
                        <a href="https://www.spotify.com/pk-en/legal/">Legal</a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/pk-en/safetyandprivacy/">
                            Safety &amp; Privacy Center
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/pk-en/legal/privacy-policy/">
                            Privacy Policy
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/pk-en/legal/cookies-policy/">
                            Cookies
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/pk-en/legal/privacy-policy/#s3">
                            About Ads
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/pk-en/accessibility/">
                            Accessibility
                        </a>
                    </div>


                </div>





                <div>

                </div>
            </div>
        </div>
        <div class="right bg-gray rounded  ">
            <div class="header">
                <div class="nav">

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                        color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18"></path>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                        color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18"></path>
                    </svg>
                </div>
                <div class="buttons">
                    <button class="signupbtn">sign up</button>
                    <button class="loginbtn">log in</button>
                </div>
            </div>
            <div class="spotify-playlist">
                <h1>spotify playlist</h1>
                <div class="card-container">
                    <div class="card">
                        <div class="play">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30"
                                color="black" fill="#1fdf64">
                                <circle cx="12" cy="12" r="10" stroke="" stroke-width="1.5"></circle>
                                <path
                                    d="M9.5 11.1998V12.8002C9.5 14.3195 9.5 15.0791 9.95576 15.3862C10.4115 15.6932 11.0348 15.3535 12.2815 14.6741L13.7497 13.8738C15.2499 13.0562 16 12.6474 16 12C16 11.3526 15.2499 10.9438 13.7497 10.1262L12.2815 9.32594C11.0348 8.6465 10.4115 8.30678 9.95576 8.61382C9.5 8.92086 9.5 9.6805 9.5 11.１９９８Z "
                                    fill="currentColor"></path>
                            </svg>
                        </div>
                        <img src="https://i.scdn.co/image/ab67616d00001e02ce643886a6df8f7a06526700" alt="">
                        <h2>Guzarish</h2>
                        <p>Satinder Sartaaj</p>
                    </div>
                    <div class="card">
                        <img src="https://i.scdn.co/image/ab67616d00001e02ce643886a6df8f7a06526700" alt="">
                        <h2>Guzarish</h2>
                        <p>Satinder Sartaaj</p>
                    </div>
                
                
                </div>

                <div class="playbar">
                    <div class="songbuttons invert">
                        <img src="previous.svg" alt="previous">
                        <img src="play.svg" alt="play">
                        <img src="nextsong.svg" alt="next">
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
